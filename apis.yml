aid: hdata
name: HData
description: >-
  HData is the AI-native operating system for energy regulation. Founded in 2018
  by Hudson Hollister, the platform turns disconnected federal and state regulatory
  filings, dockets, and proceedings from sources such as FERC, EIA, and state utility
  commissions into standardized, citable, machine-readable data. It combines centralized
  regulatory data, domain-specific AI trained on more than 20 million citable documents,
  and purpose-built tools — including HData Analytics, Regulatory Intelligence, Gateway
  for FERC data extraction, and Data Request Management — to help utilities, regulators,
  advocates, advisory firms, financial institutions, and large energy customers
  accelerate rate cases, resource planning, compliance reporting, and policy research.
